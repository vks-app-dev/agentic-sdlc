[project]
name = "agentic-sdlc"
version = "0.8.0"
description = "Multi-agent AI-native SDLC: stages, human gates, task DAG and live status for any repo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "vks-app-dev" }]
keywords = ["sdlc", "ai-agents", "agentic", "claude-code", "devops", "software-lifecycle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=1.9,<2",
    "packaging>=24",
]

[project.urls]
Homepage = "https://github.com/vks-app-dev/agentic-sdlc"
Demo = "https://github.com/vks-app-dev/agentic-sdlc-demo"
Issues = "https://github.com/vks-app-dev/agentic-sdlc/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sdlc = "agentic_sdlc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_sdlc"]
artifacts = ["src/agentic_sdlc/dashboard/static/**"]

# the Claude Code plugin travels inside the package, so an install from GitHub has the agents too
[tool.hatch.build.targets.wheel.force-include]
"plugin" = "agentic_sdlc/plugin"

[tool.hatch.build.targets.sdist]
include = ["src/", "plugin/", "schema/", "docs/", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["plugin/evals/results/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
